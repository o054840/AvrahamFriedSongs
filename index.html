<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <title>שירים של אברהם פריד</title>
  <style>
    body { font-family: Arial; direction: rtl; padding: 20px; }
    .video { margin: 20px 0; }
    iframe { width: 100%; height: 315px; }
    .popup {
      position: fixed; bottom: 20px; right: 20px;
      background: green; color: white; padding: 15px;
      border-radius: 10px; display: none;
    }
  </style>
</head>
<body>
  <h1>שירים של אברהם פריד מהשנה האחרונה</h1>
  <div id="videos"></div>
  <div id="popup" class="popup">שיר חדש נוסף!</div>

  <script>
    const apiKey = "AIzaSyCeO-21AJBfkqhH2FbhyYUstiFM2JToPHk"; // 🔑 זה המפתח שלך
    const searchQuery = "אברהם פריד";
    const maxResults = 10;
    const publishedAfter = new Date(new Date().setFullYear(new Date().getFullYear() - 1)).toISOString();

    async function fetchVideos() {
      const response = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${apiKey}&part=snippet&type=video&q=${encodeURIComponent(searchQuery)}&maxResults=${maxResults}&publishedAfter=${publishedAfter}&order=date`);
      const data = await response.json();
      const container = document.getElementById("videos");
      container.innerHTML = "";

      data.items.forEach(item => {
        const videoId = item.id.videoId;
        const title = item.snippet.title;
        container.innerHTML += `
          <div class="video">
            <h3>${title}</h3>
            <iframe src="https://www.youtube.com/embed/${videoId}" frameborder="0" allowfullscreen></iframe>
          </div>
        `;
      });
    }

    function showPopup() {
      const popup = document.getElementById("popup");
      popup.style.display = "block";
      setTimeout(() => popup.style.display = "none", 4000);
    }

    let latestVideo = null;

    async function checkForNewVideo() {
      const response = await fetch(`https://www.googleapis.com/youtube/v3/search?key=${apiKey}&part=snippet&type=video&q=${encodeURIComponent(searchQuery)}&maxResults=1&order=date`);
      const data = await response.json();
      const newVideoId = data.items[0].id.videoId;

      if (latestVideo && latestVideo !== newVideoId) {
        showPopup();
        fetchVideos();
      }

      latestVideo = newVideoId;
    }

    fetchVideos();
    setInterval(checkForNewVideo, 60000); // כל דקה בודק שיר חדש
  </script>
</body>
</html>
